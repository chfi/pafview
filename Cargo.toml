[package]
name = "pafview"
version = "0.1.0"
edition = "2021"
default-run = "pafview"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "paf-stress-test"
path = "src/bin/paf_stress_test.rs"


[features]
tracy = ["bevy/trace_tracy"]
renderdoc = ["dep:renderdoc"]
# tracy = ["dep:tracing-tracy", "tracing-tracy/enable", "tracing-subscriber"]

[dependencies]
anyhow = "1.0.80"
bimap = "0.6.3"
bytemuck = { version = "1.14.3", features = ["derive"] }
clap = { version = "4.5.4", features = ["derive"] }
crossbeam = "0.8.4"
ctrlc = "3.4.4"
directories = "5.0.1"
dirs = "5.0.1"
egui = { version = "0.29", features = ["mint"] }
egui-wgpu = { version = "0.29", features = ["winit", "wayland", "x11"] }
egui-winit = "0.29"
egui_extras = { version = "0.29", features = [
    "file",
    "image",
    "svg",
    "all_loaders",
] }
env_logger = "0.11.2"
line_drawing = "1.0.0"
lodepng = "3.10.1"
log = "0.4.21"
nalgebra = "0.32.5"
noodles = { version = "0.69.0", features = ["bgzf", "fasta", "fastq"] }
ordered-float = { version = "4.2.0", features = ["bytemuck"] }
pollster = "0.3.0"
rapier2d = "0.19.0"
ron = "0.8.1"
# rstar = { version = "0.12.0", features = ["mint"] }
rustc-hash = "1.1.0"
serde = { version = "1.0.203", features = ["derive"] }
ultraviolet = { version = "0.9.2", features = [
    "bytemuck",
    "int",
    "f64",
    "mint",
    "num-traits",
] }
wgpu = "0.20"
winit = "0.30"

# impg = { path = "../impg" }
impg = { git = "https://github.com/chfi/impg.git", rev = "5a48b8c90ef7ae9c68933dd6dfd3aab62f25a362" }
bincode = "1.3.3"
coitrees = "0.4.0"

bevy = { version = "0.14.2", features = [
    # "dynamic_linking",
    "bevy_dev_tools",
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline", # Provides cameras and other basic render pipeline features
    # "bevy_gilrs",	# Adds gamepad support
    "bevy_gizmos", # Adds support for rendering gizmos
    "bevy_gltf",   # glTF support
    "bevy_pbr",    # Adds PBR rendering
    "bevy_render", # Provides rendering functionality
    # "bevy_scene",	# Provides scene functionality
    "bevy_sprite",  # Provides sprite functionality
    "bevy_state",   # Enable built in global state machines
    "bevy_text",    # Provides text functionality
    "bevy_ui",      # A custom ECS-driven UI framework
    "bevy_winit",   # winit window and input backend
    "default_font", # Include a default font, containing only ASCII characters, at the cost of a 20kB binary size increase
    # "hdr",              # HDR image format support
    "multi_threaded",   # Enables multithreaded parallelism in the engine. Disabling it forces all engine tasks to run on a "single" # thread.
    "png",              # PNG image format support
    "sysinfo_plugin",   # Enables system information diagnostic plugin
    "tonemapping_luts",
    "webgl2",
    "x11",              # X11 display server support
], default-features = false }
bevy_egui = "0.30"
bevy_polyline = "0.10.0"
# leafwing-input-manager = { version = "0.15.1", features = ["egui"] }
leafwing-input-manager = { git = "https://github.com/Leafwing-Studios/leafwing-input-manager.git", rev = "212ff695b0bd27e5b92af2c713028829059e26ab", features = [
    "egui",
] }
bevy_mod_picking = "0.20.1"
bevy-inspector-egui = "0.27"
rand = "0.8.5"
bgzip = "0.3.1"
memmap2 = "0.9.5"
bstr = "1.10.0"
async-io = "2.3.4"
zeno = "0.3.1"
avian2d = { version = "0.1.2", features = [
    "2d",
    "bevy_scene",
    "debug-plugin",
    "default-collider",
    "f64",
    "parallel",
    "parry-f64",
], default-features = false }
rayon = "1.10.0"
# tracing-tracy = { version = "0.11.3", optional = true }
# tracing-subscriber = { version = "0.3.18", optional = true }
# revy = "0.17"

renderdoc = { version = "0.12.1", optional = true }
futures-time = "3.0.0"

[dev-dependencies]
float-cmp = "0.9.0"
proptest = "1.4.0"
rand = "0.8.5"


[profile.dev]
opt-level = 3
debug-info = "full"
debug-assertions = true
overflow-checks = true

[profile.release]
codegen-units = 1
debug = true

# [profile.dev.package."*"]
# opt-level = 3
